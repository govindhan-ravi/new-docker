version: '3.8'

services:
  # PHP 8.3 Laravel Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aureus_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
    networks:
      - aureus-net

  # Node.js Vite Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aureus_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_APP_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - aureus-net

networks:
  aureus-net:
    driver: bridge